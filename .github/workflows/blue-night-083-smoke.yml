name: Blue Neon Dark Night 0.8.3 smoke
on:
  push:
    branches:
      - work/novabar-v0.8.3-blue-neon-dark-night
  workflow_dispatch:
jobs:
  offscreen-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime/test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Compile all Python sources
        run: python -m compileall -q src/healthbar
      - name: Blue Night regression smoke
        run: python -m unittest discover -s tests -p 'test_blue_night_083.py' -v
      - name: Existing Blue Graphite FX smoke
        run: python -m unittest discover -s tests -p 'test_blue_graphite_fx.py' -v
      - name: All unit tests
        run: python -m unittest discover -s tests -v
