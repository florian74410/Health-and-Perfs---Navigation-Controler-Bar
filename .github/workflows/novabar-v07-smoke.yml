name: NovaBar v0.7 Linux smoke (no release)

on:
  push:
    branches:
      - work/novabar-v0.7-stable-optimized
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/novabar-v07-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Linux Qt essentials
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 xvfb
      - name: Install NovaBar only (no PyInstaller)
        run: python -m pip install .
      - name: Compile source
        run: python -m compileall -q src/healthbar tests/test_v07_smoke.py
      - name: Verify v0.7 Qt and shared telemetry
        env:
          QT_QPA_PLATFORM: offscreen
          HEALTHBAR_DATA_DIR: ${{ runner.temp }}/novabar-v07-test
        run: python -m unittest discover -s tests -p test_v07_smoke.py -v
      - name: Existing Python regressions
        env:
          QT_QPA_PLATFORM: offscreen
          HEALTHBAR_DATA_DIR: ${{ runner.temp }}/novabar-all-test
        run: python -m unittest discover -s tests -v

  linux-preview-package:
    name: Linux test package (not a stable release)
    needs: smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Qt / X11 packaging dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
      - name: Build only the Linux runtime
        run: |
          python -m pip install . pyinstaller==6.16.0
          python scripts/build.py
      - name: Smoke test frozen Linux runtime
        env:
          QT_QPA_PLATFORM: offscreen
          HEALTHBAR_DATA_DIR: ${{ runner.temp }}/novabar-runtime-preview
        run: dist/HealthPerfsBar/HealthPerfsBar --self-test --expect-version 0.7.0
      - name: Build the test-only Debian installer
        run: |
          python scripts/package_linux_desktop.py deb --version 0.7.0
          dpkg-deb --info dist/linux/NovaBar_0.7.0_amd64.deb
          sha256sum dist/linux/NovaBar_0.7.0_amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: NovaBar-0.7.0-LINUX-TEST-NOT-STABLE
          path: dist/linux/NovaBar_0.7.0_amd64.deb
          if-no-files-found: error
          retention-days: 14
