name: Blue Graphite Settings 0.8.2.2 QA
on:
  push:
    branches: [fix/novabar-0822-blue-graphite-settings]
  workflow_dispatch:
jobs:
  qt-offscreen:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Python compile
        run: python -m compileall -q src/healthbar
      - name: Blue Graphite settings checks
        run: python -m unittest discover -s tests -p 'test_blue_graphite_settings_0822.py' -v
      - name: Existing tests
        run: python -m unittest discover -s tests -v
