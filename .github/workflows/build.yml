name: Native installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths: ['src/**', 'scripts/**', 'tests/**', 'pyproject.toml', '.github/workflows/build.yml']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
      - run: python -m pip install . pyinstaller==6.16.0
      - run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python scripts/build.py
      - name: Smoke test packaged downloader (no network or install)
        shell: bash
        run: |
          DOWNLOADER=$(find dist -maxdepth 1 -type f -name 'NovaBarDownloader-*' | head -n 1)
          test -n "$DOWNLOADER"
          QT_QPA_PLATFORM=offscreen "$DOWNLOADER" --self-test
      - run: python scripts/package_runtime.py
      - run: python scripts/test_runtime_package.py
      - run: python scripts/test_installer_package.py
      - name: Package first-party ZIP plugins
        run: python scripts/build_plugins.py
      - name: Test the exact packaged runtime
        if: runner.os != 'macOS'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            QT_QPA_PLATFORM=offscreen dist/HealthPerfsBar/HealthPerfsBar.exe --self-test
          else
            QT_QPA_PLATFORM=offscreen dist/HealthPerfsBar/HealthPerfsBar --self-test
          fi
      - name: Test macOS runtime
        if: runner.os == 'macOS'
        run: QT_QPA_PLATFORM=offscreen dist/HealthPerfsBar.app/Contents/MacOS/HealthPerfsBar --self-test
      - name: Native Linux Mint DEB package
        if: runner.os == 'Linux'
        run: |
          python scripts/package_linux_desktop.py deb --version "$(python -c 'import healthbar;print(healthbar.__version__)')"
          dpkg-deb --info dist/linux/NovaBar_*_amd64.deb
          dpkg-deb --extract dist/linux/NovaBar_*_amd64.deb dist/deb-qa
          QT_QPA_PLATFORM=offscreen HEALTHBAR_DATA_DIR="$RUNNER_TEMP/novabar-deb-qa" dist/deb-qa/usr/lib/novabar/HealthPerfsBar/HealthPerfsBar --self-test --expect-version "$(python -c 'import healthbar;print(healthbar.__version__)')"
      - name: Flatpak tools and Freedesktop runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y flatpak dbus-x11
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
      - name: Native Flatpak bundle and smoke test
        if: runner.os == 'Linux'
        run: |
          python scripts/package_linux_desktop.py flatpak --version "$(python -c 'import healthbar;print(healthbar.__version__)')"
          flatpak install --user --noninteractive -y dist/linux/NovaBar_*.flatpak
          QT_QPA_PLATFORM=offscreen dbus-run-session -- flatpak run --user --env=QT_QPA_PLATFORM=offscreen io.github.florian74410.NovaBar --self-test --expect-version "$(python -c 'import healthbar;print(healthbar.__version__)')"
      - name: Linux and Bazzite installer archives
        if: runner.os == 'Linux'
        run: |
          cp scripts/install-binary-linux.sh dist/Install.sh
          chmod +x dist/Install.sh
          XZ_OPT=-1 tar -C dist -cJf CyberNexusHUD-Linux-x86_64.tar.xz CyberNexusInstaller Install.sh
          cp CyberNexusHUD-Linux-x86_64.tar.xz CyberNexusHUD-Bazzite-x86_64.tar.xz
      - name: Windows setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" scripts\windows-installer.iss'
      - name: macOS disk image
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg
          cp -R dist/CyberNexusInstaller.app dmg/
          ARCH=$(uname -m)
          hdiutil create -volname 'CYBER NEXUS HUD' -srcfolder dmg -ov -format UDZO CyberNexusHUD-macOS-$ARCH.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: CyberNexusHUD-${{ matrix.os }}
          if-no-files-found: error
          path: |
            CyberNexusHUD-*.tar.xz
            CyberNexusHUD-*.dmg
            dist/*-Setup-*.exe
            NovaBar-runtime-*.zip
            dist/linux/*.deb
            dist/linux/*.flatpak
            dist/plugins/*.zip
            dist/NovaBarDownloader-*
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'pull_request' && github.head_ref == 'fix/novabar-holo-network-v052' && github.event.pull_request.head.repo.full_name == github.repository)
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Validate explicitly requested release
        env:
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY_RELEASE'
          import json, os, tomllib
          from pathlib import Path
          tag = "v" + tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["RELEASE_EVENT"] == "pull_request":
              request = json.loads(Path(".release/0.5.2.json").read_text())
              assert request == {"tag": tag, "publish": True}, "Release not explicitly requested"
          else:
              assert os.environ["GITHUB_REF_NAME"] == tag, "Tag/version mismatch"
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("NOVABAR_RELEASE_TAG=" + tag + "\n")
          PY_RELEASE
      - name: Gather versioned installers and runtimes
        run: |
          mkdir release
          find artifacts -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.flatpak' -o -name '*-Setup-*.exe' -o -name 'CyberNexusHUD-*.tar.xz' -o -name 'NovaBar-runtime-*.zip' \) -exec cp {} release/ \;
          find artifacts -type f -name '*-v*.zip' -exec cp {} release/ \;
          python scripts/package_executables.py artifacts
          cp Executable/Linux/*.run release/
          find artifacts -type f -name 'NovaBarDownloader-*' -exec cp {} release/ \;
          python scripts/release_manifest.py "$NOVABAR_RELEASE_TAG"
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$NOVABAR_RELEASE_TAG" release/* --target "${{ github.event.pull_request.head.sha || github.sha }}" --title "CYBER NEXUS HUD / NovaBar $NOVABAR_RELEASE_TAG" --generate-notes
  executable-folder:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/cyber-nexus-installer-v03'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: CyberNexusHUD-*
          path: native-artifacts
      - name: Assemble standalone installers at repository root
        env:
          NEXUS_BUILD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/package_executables.py native-artifacts
      - name: Verify Linux desktop installers
        run: |
          VERSION=$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          test -s "Executable/Linux/NovaBar_${VERSION}_amd64.deb"
          test -s "Executable/Linux/NovaBar_${VERSION}_x86_64.flatpak"
          dpkg-deb --info Executable/Linux/NovaBar_*.deb
      - name: Verify the Linux single-file installer
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
          sh Executable/Linux/CyberNexusHUD-Linux-x86_64.run --check
          sh Executable/Linux/CyberNexusHUD-Linux-x86_64.run --verify
      - name: Commit installers to development branch and main
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name 'CYBER NEXUS HUD builds'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          export_dir=$(mktemp -d)
          cp -a Executable "$export_dir/Executable"
          git restore --staged --worktree Executable
          git fetch origin "$TARGET_BRANCH"
          git switch --detach FETCH_HEAD
          cp -a "$export_dir/Executable/." Executable/
          git add -f Executable
          if ! git diff --cached --quiet; then
            git commit -m 'build: publish standalone OS installers in Executable [skip ci]'
            git push origin "HEAD:$TARGET_BRANCH"
          fi
          git fetch origin main --depth=1
          git switch --detach origin/main
          mkdir -p Executable
          cp -a "$export_dir/Executable/." Executable/
          git add -f Executable
          if ! git diff --cached --quiet; then
            git commit -m 'build: add downloadable CYBER NEXUS HUD installers [skip ci]'
            git push origin HEAD:main
          fi
          rm -rf -- "$export_dir"
