name: NOVA experimental preview archive
on:
  workflow_dispatch:
  push:
    branches: [feature/nova-nexus-hd-foundation]
    paths:
      - "nova_nexus/**"
      - "Assets/Wallpapers/**"
      - "docs/NOVA_*.md"
      - ".github/workflows/nova-preview.yml"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate source
        run: |
          python -m compileall -q nova_nexus
          python -m unittest discover -s tests -p "test_nova_*.py" -v
      - name: Render prototype theme
        run: |
          mkdir -p staging/NOVA-NEXUS-HD
          python - <<'PY'
          from nova_nexus.desktop_theme import export_gtk_theme
          from nova_nexus.xfwm4 import export_xfwm4_theme
          export_gtk_theme("staging/NOVA-NEXUS-HD")
          export_xfwm4_theme("staging/NOVA-NEXUS-HD")
          PY
      - name: Archive source-only preview
        run: |
          mkdir -p dist/NOVA-NEXUS-HD-preview
          cp -r nova_nexus dist/NOVA-NEXUS-HD-preview/
          cp -r staging/NOVA-NEXUS-HD dist/NOVA-NEXUS-HD-preview/Theme
          mkdir -p dist/NOVA-NEXUS-HD-preview/Wallpapers
          cp Assets/Wallpapers/nova-electric-blue-pcb.svg dist/NOVA-NEXUS-HD-preview/Wallpapers/
          cp docs/NOVA_DESKTOP_INSTALL.md dist/NOVA-NEXUS-HD-preview/README.md
          tar -C dist -czf NOVA-NEXUS-HD-preview.tar.gz NOVA-NEXUS-HD-preview
          sha256sum NOVA-NEXUS-HD-preview.tar.gz > NOVA-NEXUS-HD-preview.SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: NOVA-NEXUS-HD-preview
          path: |
            NOVA-NEXUS-HD-preview.tar.gz
            NOVA-NEXUS-HD-preview.SHA256SUMS
          retention-days: 14
