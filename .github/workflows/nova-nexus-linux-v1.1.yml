name: NOVA NEXUS HD 1.1 Linux validation

on:
  workflow_dispatch:
  push:
    branches: [work/nova-nexus-hd-v1.1-linux-stability]
    paths: ['src/**', 'scripts/**', 'tests/**', 'pyproject.toml', 'packaging/**', '.github/workflows/**']
  pull_request:
    branches: [release/nova-nexus-hd-v1.1.0]
    paths: ['src/**', 'scripts/**', 'tests/**', 'pyproject.toml', 'packaging/**', '.github/workflows/**']

permissions:
  contents: read

concurrency:
  group: nova-nexus-linux-v1.1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Linux and isolated XFCE dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 \
            xvfb xfwm4 xfce4-panel dbus-x11 python3-gi gir1.2-gtk-3.0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xkb1 libxcb-shape0
      - name: Install Python package and Linux builder
        run: python -m pip install . pyinstaller==6.16.0
      - name: Unit tests
        run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Isolated XFCE/X11 integration
        run: xvfb-run -a -s "-screen 0 1280x720x24" dbus-run-session -- python scripts/test_xfce_session.py
      - name: Window decoration and theme migration
        run: xvfb-run -a -s "-screen 0 1280x720x24" dbus-run-session -- python scripts/test_window_decorations.py
      - name: StatusNotifier and notification integration
        run: |
          QT_QPA_PLATFORM=offscreen dbus-run-session -- python scripts/test_status_notifier.py
          QT_QPA_PLATFORM=offscreen dbus-run-session -- python scripts/test_notification_bus.py
      - name: Build Linux runtime
        run: |
          python scripts/build.py
          python scripts/package_runtime.py
          python scripts/test_runtime_package.py
          python scripts/test_installer_package.py
          python scripts/build_plugins.py
          QT_QPA_PLATFORM=offscreen python scripts/test_terminal_runtime.py
      - name: Build and inspect Debian package
        run: |
          VERSION=$(python -c 'import healthbar;print(healthbar.__version__)')
          python scripts/package_linux_desktop.py deb --version "$VERSION"
          dpkg-deb --info "dist/linux/NovaBar_${VERSION}_amd64.deb"
          dpkg-deb --extract "dist/linux/NovaBar_${VERSION}_amd64.deb" dist/deb-qa
          QT_QPA_PLATFORM=offscreen HEALTHBAR_DATA_DIR="$RUNNER_TEMP/novabar-deb-qa" \
            "dist/deb-qa/usr/lib/novabar/HealthPerfsBar/HealthPerfsBar" --self-test --expect-version "$VERSION"
      - name: Record Linux artifact checksums
        run: |
          mkdir -p release-linux
          find dist -type f \( -name '*.deb' -o -name '*.zip' -o -name '*.tar.xz' \) -exec cp --parents {} release-linux/ \;
          test -n "$(find release-linux -type f -print -quit)"
          (cd release-linux && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          (cd release-linux && sha256sum --check SHA256SUMS))
      - uses: actions/upload-artifact@v4
        with:
          name: nova-nexus-hd-1.1-linux
          if-no-files-found: error
          path: release-linux/
