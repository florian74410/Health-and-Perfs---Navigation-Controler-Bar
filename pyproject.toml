[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "health-perfs-bar"
version = "0.6.1"
description = "Transparent desktop HUD and read-only hardware telemetry and safe extension host"
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials>=6.8,<6.9", "psutil>=5.9,<8", "pynput>=1.7,<2; sys_platform != 'linux'", "python-xlib>=0.33; sys_platform == 'linux'"]

[project.scripts]
healthbar = "healthbar.app:main"
novabar-downloader = "healthbar.bootstrapper:main"
cyber-nexus-installer = "healthbar.installer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
healthbar = ["assets/*.png", "assets/plugins/*.zip"]
